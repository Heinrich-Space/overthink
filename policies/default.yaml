overthink:
  mode: strict

  reasoning:
    default_level: L1
    allow_deep_reasoning: true
    avoid_unnecessary_planning: true

  execution:
    minimal_changes: true
    avoid_unrelated_refactoring: true
    one_primary_action: true
    block_waste_patterns: true
    kill_fail_loops: true
    finish_bias_under_time_pressure: true

  investigation:
    evidence_required: true
    detect_duplicate_searches: true
    progressive_search: true
    fast_triage: true

  budgets:
    simple:
      max_retries: 1
      max_actions: 4
      planning_seconds: 5
      investigation_seconds: 10
    normal:
      max_retries: 2
      max_actions: 6
      planning_seconds: 8
      investigation_seconds: 15
    complex:
      max_retries: 3
      max_actions: 12
      planning_seconds: 20
      investigation_seconds: 40
    critical:
      max_retries: 3
      max_actions: 18
      planning_seconds: 30
      investigation_seconds: 60

  verification:
    require_tests_when_applicable: true
    verify_before_completion: true

  communication:
    concise: true
    no_reasoning_narration: true
    report_unverified_results: true
    max_user_facing_lines: 6

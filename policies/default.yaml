overthink:
  mode: strict

  reasoning:
    default_level: L1
    allow_deep_reasoning: true
    avoid_unnecessary_planning: true

  execution:
    minimal_changes: true
    avoid_unrelated_refactoring: true
    one_primary_action: true
    block_waste_patterns: true

  investigation:
    evidence_required: true
    detect_duplicate_searches: true
    progressive_search: true

  budgets:
    simple:
      max_retries: 1
      max_actions: 4
      planning_seconds: 5
      investigation_seconds: 10
    normal:
      max_retries: 2
      max_actions: 8
      planning_seconds: 10
      investigation_seconds: 20
    complex:
      max_retries: 3
      max_actions: 15
      planning_seconds: 30
      investigation_seconds: 60
    critical:
      max_retries: 4
      max_actions: 25
      planning_seconds: 45
      investigation_seconds: 90

  verification:
    require_tests_when_applicable: true
    verify_before_completion: true

  communication:
    concise: true
    no_reasoning_narration: true
    report_unverified_results: true
    max_user_facing_lines: 8
